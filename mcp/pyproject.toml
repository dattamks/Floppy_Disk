[project]
name = "floppy-disk-mcp"
version = "0.1.0"
description = "MCP server for the Floppy Disk cloud-storage platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
floppy-disk-mcp = "floppy_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["floppy_mcp"]
